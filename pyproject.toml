[project]
name = "testina"
version = "0.1.0"
dependencies = [
    "flask==3.1.3",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.7",
    "pytest==9.1.1",
    "pytest_mock==3.15.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["I001"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that use real integrations",
]
testpaths = ["tests"]
